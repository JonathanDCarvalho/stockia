services:
  # Postgres database service
  postgres:
    image: postgres:18.6-trixie
    environment:
      POSTGRES_DB: stockai
      POSTGRES_USER: stockai
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data:
